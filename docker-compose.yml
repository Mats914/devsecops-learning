# Docker Compose – startar hela stacken lokalt eller i produktion.
# Frontend på port 80, backend internt på 5000.

version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devsecops-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Jwt__Key=${JWT_KEY:-CHANGE_ME_USE_ENV_VAR_32CHARS_MIN!}
      - Jwt__Issuer=DevSecOpsApi
      - Jwt__Audience=DevSecOpsClient
      - ConnectionStrings__DefaultConnection=Data Source=/data/app.db
    volumes:
      - db-data:/data
      - uploads:/app/wwwroot/uploads
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: devsecops-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy  # vänta tills API svarar på /health
    restart: unless-stopped
    networks:
      - app-net

volumes:
  db-data:    # SQLite-databas
  uploads:    # uppladdade bilder
  logs:       # Serilog-loggar

networks:
  app-net:
    driver: bridge

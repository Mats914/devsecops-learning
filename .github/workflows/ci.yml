name: DevSecOps CI/CD Pipeline v2

on:
  push:    { branches: [main, develop] }
  pull_request: { branches: [main] }

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION:   '20'

jobs:
# ═══════════════════════════════════════════════════════════════════════════
# JOB 1 — Backend: Security Scan + Build + Test
# ═══════════════════════════════════════════════════════════════════════════
  backend:
    name: Backend — Scan · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Restore packages
        working-directory: backend
        run: dotnet restore DevSecOpsApi.csproj

      # ── SECURITY GATE 1: Dependency vulnerability scan ──────────────────
      - name: 🔒 NuGet vulnerability scan
        working-directory: backend
        run: |
          dotnet list DevSecOpsApi.csproj package --vulnerable --include-transitive 2>&1 \
            | tee vuln-report.txt
          if grep -qiE "(High|Critical)" vuln-report.txt; then
            echo "❌ SECURITY GATE FAILED: High/Critical NuGet vulnerabilities found!"
            exit 1
          fi
          echo "✅ NuGet scan passed."

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build backend
        working-directory: backend
        run: dotnet build DevSecOpsApi.csproj -c Release --no-restore

      # ── Unit tests ───────────────────────────────────────────────────────
      - name: Run unit tests
        working-directory: backend
        run: |
          dotnet test Tests/DevSecOpsApi.Tests.csproj \
            -c Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults/

# ═══════════════════════════════════════════════════════════════════════════
# JOB 2 — Frontend: Security Scan + Lint + Test + Build
# ═══════════════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend — Scan · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── SECURITY GATE 2: npm audit ───────────────────────────────────────
      - name: 🔒 npm dependency audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high 2>&1 | tee npm-audit.txt || {
            echo "❌ SECURITY GATE FAILED: High/Critical npm vulnerabilities!"
            exit 1
          }
          echo "✅ npm audit passed."

      # ── TypeScript + Lint ─────────────────────────────────────────────────
      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: ESLint static analysis
        working-directory: frontend
        run: npm run lint

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

# ═══════════════════════════════════════════════════════════════════════════
# JOB 3 — CodeQL SAST (C# + TypeScript)
# ═══════════════════════════════════════════════════════════════════════════
  codeql:
    name: 🔒 CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Setup .NET (C# build for CodeQL)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Build backend for CodeQL
        if: matrix.language == 'csharp'
        working-directory: backend
        run: dotnet build DevSecOpsApi.csproj -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

# ═══════════════════════════════════════════════════════════════════════════
# JOB 4 — Docker Build & Scan
# ═══════════════════════════════════════════════════════════════════════════
  docker-scan:
    name: 🔒 Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.backend -t devsecops-backend:ci .
          docker build -f docker/Dockerfile.frontend -t devsecops-frontend:ci .

      # ── SECURITY GATE 3: Container vulnerability scan ───────────────────
      - name: 🔒 Trivy scan – backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-backend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: 🔒 Trivy scan – frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-frontend:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

# ═══════════════════════════════════════════════════════════════════════════
# JOB 5 — Health Check after Smoke Test
# ═══════════════════════════════════════════════════════════════════════════
  smoke-test:
    name: 🚀 Smoke Test (API Health Check)
    runs-on: ubuntu-latest
    needs: [backend, frontend, codeql]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Start backend
        working-directory: backend
        run: |
          dotnet run --project DevSecOpsApi.csproj &
          sleep 15

      # ── SECURITY GATE 4: Health endpoint must return 200 ────────────────
      - name: 🔒 Health check gate
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed with status $STATUS"
            exit 1
          fi
          echo "✅ Health check passed (200 OK)"

# ═══════════════════════════════════════════════════════════════════════════
# JOB 6 — Deploy (main branch only, all gates must pass)
# ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [backend, frontend, codeql, docker-scan, smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
